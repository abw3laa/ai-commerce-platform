name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build (with Postgres + Prisma)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Temporary PostgreSQL container for this job only — it lives for the
    # duration of the run and is discarded afterwards. Nothing here depends
    # on any PostgreSQL instance outside this workflow.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ai_commerce_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ai_commerce_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      # Credentials here are throwaway values for a container that only
      # exists for this single job run — not a real secret.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ai_commerce_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Wait for PostgreSQL to accept connections
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U ci && exit 0
            sleep 1
          done
          echo "PostgreSQL did not become ready in time" >&2
          exit 1

      # `migrate deploy` is the non-interactive command meant for CI/
      # production: it applies whatever committed migrations exist
      # (admin_users, then admin_sessions as of Task 3) and does nothing
      # if there are none — it must NOT be used to create a migration.
      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency vulnerability audit
        run: |
          set +e
          npm audit --omit=dev --omit=optional --json > /tmp/npm-audit.json
          audit_exit=$?
          node scripts/check-npm-audit.mjs /tmp/npm-audit.json
          check_exit=$?
          if [ $check_exit -ne 0 ]; then exit $check_exit; fi
          if [ $audit_exit -ne 0 ]; then echo "npm audit reported only documented Prisma 7.10 devOptional findings; continuing."; fi

      - name: Validate production scripts
        run: bash -n scripts/backup-postgres.sh scripts/restore-postgres.sh scripts/verify-production.sh scripts/monitor-production.sh scripts/security-smoke.sh

      - name: Build production Docker image
        run: docker build --pull -t ai-commerce-platform:ci .

  android:
    name: Android admin build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
      - name: Assemble Android admin
        working-directory: android-admin
        run: gradle assembleDebug --no-daemon -PADMIN_BASE_URL=https://CHANGE-ME.example/admin/app
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v6
        with:
          name: ai-commerce-admin-android-debug
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
