name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build (with Postgres + Prisma)
    runs-on: ubuntu-latest

    # Temporary PostgreSQL container for this job only — it lives for the
    # duration of the run and is discarded afterwards. Nothing here depends
    # on any PostgreSQL instance outside this workflow.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ai_commerce_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ai_commerce_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      # Credentials here are throwaway values for a container that only
      # exists for this single job run — not a real secret.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ai_commerce_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Wait for PostgreSQL to accept connections
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U ci && exit 0
            sleep 1
          done
          echo "PostgreSQL did not become ready in time" >&2
          exit 1

      # No migrations exist yet at this stage of the project (see
      # prisma/migrations — intentionally empty). `migrate deploy` is the
      # non-interactive command meant for CI/production: it applies
      # whatever committed migrations exist and does nothing if there are
      # none. It must NOT be used to silently create a migration, which is
      # exactly the behavior we want to verify here.
      - name: Apply Prisma migrations (none expected yet)
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
