name: Android Admin

on:
  push:
    branches: [main]
    paths: ["android-admin/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android-admin/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build Android debug APK
        run: gradle :app:assembleDebug --no-daemon -PADMIN_BASE_URL=https://example.invalid/admin
